- name: Make dir
  ansible.windows.win_file:
    path: '{{ ansible_user_dir }}/Documents/WindowsPowerShell'
    state: directory

- name: Copy profile
  ansible.windows.win_copy:
    src: ./profile.ps1
    dest: '{{ ansible_user_dir }}\Documents\WindowsPowerShell\Microsoft.PowerShell_profile.ps1'

- name: Install PSReadline
  ansible.windows.powershell:
    script: Install-Module PSReadLine -Force -Confirm:$False

- name: Enable scripts
  ansible.windows.powershell:
    script: Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine